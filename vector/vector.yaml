# Phase 1: syslog -> ECS-lite JSON -> Redpanda topic `events`.
# The consumer (backend/app/ingest/consumer.py) reads this topic and validates
# each message against the EcsEvent model before writing to ClickHouse.

sources:
  syslog:
    type: syslog
    address: 0.0.0.0:5140
    mode: tcp

  syslog_udp:
    type: syslog
    address: 0.0.0.0:5141
    mode: udp

transforms:
  to_ecs_lite:
    type: remap
    inputs: [syslog, syslog_udp]
    source: |
      # Map syslog fields onto ECS-lite. Unknown fields are left unset (null).
      .raw = encode_json(.)

      ecs = {}
      ecs."@timestamp" = to_string(.timestamp) ?? ""
      ecs."event.kind" = "event"
      ecs."event.dataset" = .appname || "syslog"
      ecs."event.action" = .msgid || "syslog_message"
      ecs.message = .message || .

      # Syslog severity (0=emerg..7=debug) -> ECS 0..100 (higher = worse).
      sev = to_int(.severity) ?? 6
      ecs."event.severity" = (7 - sev) * 14
      ecs."event.outcome" = "unknown"
      ecs."event.category" = "host"

      ecs."host.name" = .hostname || .source_ip || "unknown"
      ecs."log.level" = .severity_name || "info"
      ecs."log.logger" = .appname || "syslog"
      ecs."observer.vendor" = "Sentinel"
      ecs."observer.product" = "Vector"
      ecs.raw = .raw

      . = ecs

sinks:
  redpanda:
    type: kafka
    inputs: [to_ecs_lite]
    bootstrap_servers: redpanda:9092
    topic: events
    encoding:
      codec: json
    compression: lz4

api:
  enabled: true
  address: 0.0.0.0:8686
