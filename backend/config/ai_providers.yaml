# AI Gateway account pool (Appendix B). Free-tier only.
# Quota reality: Groq quota is per-ORGANIZATION, Gemini per-PROJECT — multiple keys
# in the same org/project do NOT add quota. Real rotation = across providers +
# distinct accounts/projects. `limits` only seed the local buckets; runtime response
# headers (x-ratelimit-*, retry-after) are the source of truth.
#
# api_key_env names an environment variable; the key itself is never stored here.

accounts:
  - name: groq-1
    provider: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_KEY_1
    models: [llama-3.3-70b-versatile, llama-3.1-8b-instant, openai/gpt-oss-120b]
    limits: { rpm: 30, tpm: 12000, rpd: 1000 }

  - name: groq-2          # a DIFFERENT Groq org (separate bucket), if available
    provider: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_KEY_2
    models: [llama-3.1-8b-instant]
    limits: { rpm: 30, tpm: 6000, rpd: 14400 }

  - name: gemini-1
    provider: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_KEY_1
    models: [gemini-2.5-flash, gemini-2.5-flash-lite]
    limits: { rpm: 15, tpm: 250000, rpd: 1500 }

# Per-task routing: quality -> cheap, with cross-provider/account fallback.
# Each entry is "provider:model"; the router expands it to concrete accounts.
routing:
  triage:  [groq:llama-3.3-70b-versatile, gemini:gemini-2.5-flash, groq:llama-3.1-8b-instant]
  nl2sql:  [gemini:gemini-2.5-flash, groq:llama-3.3-70b-versatile]
  report:  [gemini:gemini-2.5-flash, groq:openai/gpt-oss-120b]
  chat:    [groq:llama-3.1-8b-instant, gemini:gemini-2.5-flash-lite]

# Providers whose free tier may train on data — forbidden for sensitive tasks.
train_on_data_providers: [gemini]
