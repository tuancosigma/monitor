# Sentinel dev stack. `docker compose up` boots the full platform locally.
# Stateful services (clickhouse, redpanda) have generous start_period healthchecks
# so dependent services wait for real readiness on first (slow) boot.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: ${SENTINEL_CLICKHOUSE_DATABASE:-sentinel}
      CLICKHOUSE_USER: ${SENTINEL_CLICKHOUSE_USER:-sentinel}
      CLICKHOUSE_PASSWORD: ${SENTINEL_CLICKHOUSE_PASSWORD:-sentinel}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  vector:
    image: timberio/vector:0.39.0-debian
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    ports:
      - "5140:5140"       # syslog TCP
      - "5141:5141/udp"   # syslog UDP
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vector", "validate", "--no-environment", "/etc/vector/vector.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    environment:
      SENTINEL_CLICKHOUSE_HOST: clickhouse
      SENTINEL_CLICKHOUSE_USER: ${SENTINEL_CLICKHOUSE_USER:-sentinel}
      SENTINEL_CLICKHOUSE_PASSWORD: ${SENTINEL_CLICKHOUSE_PASSWORD:-sentinel}
      SENTINEL_CLICKHOUSE_DATABASE: ${SENTINEL_CLICKHOUSE_DATABASE:-sentinel}
      SENTINEL_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SENTINEL_FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clickhouse-data:
  redpanda-data:
